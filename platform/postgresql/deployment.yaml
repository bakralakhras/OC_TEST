apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: bitnami/postgresql:15
        env:
        - name: POSTGRESQL_USERNAME
          value: "hive"
        - name: POSTGRESQL_PASSWORD
          value: "hive123"
        - name: POSTGRESQL_DATABASE
          value: "metastore"
        - name: POSTGRESQL_POSTGRES_PASSWORD
          value: "hive123"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /bitnami/postgresql
      volumes:
      - name: data
        emptyDir: {}
