apiVersion: v1
kind: Secret
metadata:
  name: schema-registry-postgres
  namespace: schema-registry
type: Opaque
stringData:
  POSTGRES_USER: schema_registry
  POSTGRES_PASSWORD: schema_registry123
  POSTGRES_DB: schema_registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry-postgres
  namespace: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry-postgres
    spec:
      containers:
        - name: postgresql
          image: postgres:15
          ports:
            - name: postgresql
              containerPort: 5432
          envFrom:
            - secretRef:
                name: schema-registry-postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry-postgres
  namespace: schema-registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: schema-registry-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
